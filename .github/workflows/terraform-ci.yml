name: Terraform Ephemeral Environment

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ephemeral:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_group_name: ${{ vars.TF_VAR_group_name || 'equipo1' }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.5

      - name: Validate AWS credentials
        run: aws sts get-caller-identity

      - name: Validate required terraform secrets
        run: |
          if [ -z "$TF_VAR_db_password" ]; then
            echo "Missing required secret: TF_VAR_db_password"
            exit 1
          fi

      - name: Terraform init (without backend)
        working-directory: src
        run: terraform init -backend=false

      - name: Terraform fmt check
        run: terraform -chdir=src fmt -check -recursive

      - name: Terraform validate
        working-directory: src
        run: terraform validate

      - name: Terraform apply (ephemeral)
        if: github.event_name == 'workflow_dispatch'
        id: tf_apply
        working-directory: src
        run: terraform apply -auto-approve

      - name: Terraform destroy (always)
        if: always() && github.event_name == 'workflow_dispatch' && steps.tf_apply.outcome == 'success'
        working-directory: src
        run: terraform destroy -auto-approve
